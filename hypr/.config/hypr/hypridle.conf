general {
    lock_cmd = ~/.config/hypr/scripts/lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    # Wait for the lock screen to acquire the session lock before sleeping.
    inhibit_sleep = 3
}

# Lock after five minutes without input.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off displays after ten minutes; restore them on activity.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after twenty minutes without input, on battery only. On AC the
# session still locks and the displays still turn off, but long agent runs,
# builds, and downloads keep going.
listener {
    timeout = 1200
    on-timeout = ~/.config/hypr/scripts/on-ac-power || systemctl suspend
}
