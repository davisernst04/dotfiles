add_newline = false

format = """
$os$directory$git_branch$git_status $nodejs$python$rust$golang$c$cpp$java$ruby$docker_context
$cmd_duration$character"""

[os]
disabled = true

[directory]
style = "bold #8aadf4"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #c6a0f6"
format = '[$symbol$branch]($style) '

[git_status]
format = '$all_status$ahead_behind'
untracked = "[ ${count}](bold #8bd5ca) "
modified = "[ ${count}](bold #eed49f) "
staged = "[ ${count}](bold #a6da95) "
deleted = "[ ${count}](bold #ed8796) "
renamed = "[󰑕 ${count}](bold #c6a0f6) "
conflicted = "[ ${count}](bold #ed8796) "
ahead = "[⇡${count}](bold #8aadf4) "
behind = "[⇣${count}](bold #8aadf4) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold #8aadf4) "

[character]
success_symbol = "[❯](bold #a6da95)"
error_symbol = "[✖](bold #ed8796)"
vicmd_symbol = "[❮](bold #eed49f)"

[c]
style = "bold #8aadf4"
symbol = " "
format = '[$symbol$version]($style) '

[cpp]
style = "bold #8aadf4"
symbol = " "
format = '[$symbol$version]($style) '

[docker_context]
symbol = " "
format = '[$symbol$context]($style) '

[golang]
style = "bold #8bd5ca"
symbol = " "
format = '[$symbol$version]($style) '

[java]
style = "bold #ed8796"
symbol = " "
format = '[$symbol$version]($style) '

[nodejs]
style = "bold #a6da95"
symbol = " "
format = '[$symbol$version]($style) '

[python]
style = "bold #8aadf4"
symbol = " "
format = '[$symbol$version]($style) '

[ruby]
style = "bold #ed8796"
symbol = " "
format = '[$symbol$version]($style) '

[rust]
style = "bold #f5a97f"
symbol = "󱘗 "
format = '[$symbol$version]($style) '

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bold #eed49f"
