set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g extended-keys on

set -g focus-events on
set -g status-interval 5
set-option -g status-position top
set -g escape-time 0
set -g repeat-time 500
set -g display-time 1500
set -g history-limit 50000
set -g mode-keys vi
set -g status-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g mouse on
set -g set-clipboard on

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

setw -g monitor-activity on
set -g visual-activity off

unbind C-b
set -g prefix C-z
bind C-z send-prefix

bind -n S-Left  previous-window
bind -n S-Right next-window

bind -n C-Left  switch-client -p
bind -n C-Right switch-client -n

bind Space last-window
bind Tab   switch-client -l

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
bind '<' swap-window -t -1
bind '>' swap-window -t +1

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r m resize-pane -Z

bind q kill-pane
bind w kill-window

bind p swap-pane
bind P paste-buffer

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind r source-file ~/.tmux.conf \; display-message " tmux.conf reloaded"
bind b set-option status
bind S set-window-option synchronize-panes \; display-message "synchronize-panes: #{?synchronize-panes,ON,OFF}"
bind C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

bind f display-popup -E -w 70% -h 70% "dir=\$({{ zoxide query -l 2>/dev/null; fd -t d --max-depth 1 . ~/ ~/projects ~/dotfiles 2>/dev/null; }} | awk '!seen[\$0]++' | fzf --reverse) && [ -n \"\$dir\" ] && name=\$(basename \"\$dir\" | tr . _) && tmux new-session -d -s \"\$name\" -c \"\$dir\" 2>/dev/null; tmux switch-client -t \"\$name\""

bind x display-popup -E -w 70% -h 70% "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind X confirm-before -p "Kill session #S? (y/n)" "run-shell 'tmux switch-client -n \; kill-session -t \"#S\"'"

bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -t "%%"'

set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_transparent 0

set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_pane_id_style hide
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_terminal_icon 
set -g @tokyo-night-tmux_active_terminal_icon 
set -g @tokyo-night-tmux_window_tidy_icons 0

set -g @tokyo-night-tmux_show_path 0
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_show_git 0

set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_date_format hide
set -g @tokyo-night-tmux_time_format 12H

set -g @tokyo-night-tmux_show_wbg 0
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_music 0
set -g @tokyo-night-tmux_show_battery_widget 0
set -g @tokyo-night-tmux_show_hostname 0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'

set -g @yank_selection_mouse 'clipboard'

run '~/.tmux/plugins/tpm/tpm'
