set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g extended-keys on

set -g focus-events on
set -g status-interval 60
set-option -g status-position top
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default]'
set -g status-right ''
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#73daca,bold] #I:#W #[default]'
set -g escape-time 0
set -g repeat-time 500
set -g display-time 1500
set -g history-limit 50000
set -g mode-keys vi
set -g status-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g mouse on
set -g set-clipboard on

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

setw -g monitor-activity on
set -g visual-activity off

unbind C-b
set -g prefix C-z
bind C-z send-prefix

bind Space last-window
bind Tab   switch-client -l

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
bind n next-window
bind N new-session -c "#{pane_current_path}"
bind '<' swap-window -t -1
bind '>' swap-window -t +1

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r m resize-pane -Z

bind q kill-pane
bind w kill-window

bind p swap-pane
bind P paste-buffer

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind r source-file ~/.tmux.conf \; display-message " tmux.conf reloaded"
bind b set-option status
bind S set-window-option synchronize-panes \; display-message "synchronize-panes: #{?synchronize-panes,ON,OFF}"
bind C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

bind f display-popup -E -w 70% -h 70% '"$HOME/.tmux/scripts/session-picker" projects'

bind x display-popup -E -w 70% -h 70% '"$HOME/.tmux/scripts/session-picker" sessions "#{session_id}"'

bind X confirm-before -p "Kill session #S? (y/n)" "run-shell 'tmux switch-client -n \; tmux kill-session -t \"#S\"'"

# lazygit for the current pane's repository: review agent changes, stage hunks.
# (prefix + g is tmux's built-in floating-pane move table.)
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'command -v lazygit >/dev/null 2>&1 && exec lazygit || { echo "lazygit is not installed"; read -r _; }'

bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -t "%%"'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'

set -g @yank_selection_mouse 'clipboard'

run '~/.tmux/plugins/tpm/tpm'
