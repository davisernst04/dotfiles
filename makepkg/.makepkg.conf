# Inherit Arch's current makepkg defaults, but do not build split debug-symbol
# packages for routine personal/AUR installs. Re-enable `debug` per PKGBUILD
# when investigating a native crash.
_lean_makepkg_options=()
for _lean_makepkg_option in "${OPTIONS[@]}"; do
  case "$_lean_makepkg_option" in
    debug|'!debug') ;;
    *) _lean_makepkg_options+=("$_lean_makepkg_option") ;;
  esac
done
OPTIONS=("${_lean_makepkg_options[@]}" '!debug')
unset _lean_makepkg_option _lean_makepkg_options
