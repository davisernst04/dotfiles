include current-theme.conf

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
cursor_shape beam
cursor_beam_thickness 2
window_padding_width 0 0 0 0
confirm_os_window_close 0

# Paste directly, including multiline text in Neovim.
paste_actions quote-urls-at-prompt

# Allow terminal programs (including over SSH) to read the system clipboard.
# Keep existing write access and confirmation for reading the primary selection.
clipboard_control write-clipboard write-primary read-clipboard read-primary-ask

# Notify when a command that ran for 30 seconds or more finishes in a window
# without focus. Kitty sends it, so notification-focus can return to the window.
notify_on_cmd_finish unfocused 30
